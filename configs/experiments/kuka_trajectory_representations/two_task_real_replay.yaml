# ARCHIVAL: retired stored-trajectory Real Replay; active loading rejects this mode.
experiment: diffcrl
environment:
  backend: kuka-v3
  reward_function_version: v2
bc:
  epochs: 100
  batch_size: 256
  learning_rate: 0.001
  loss: post-tanh-mse
diffusion:
  epochs: 100
  batch_size: 8
  learning_rate: 0.001
  steps: 100
  width: 64
  action_space: raw
  action_clamp_epsilon: 0.0001
  generated_action_projection: none
  trajectory_representation: structured_22d
continual:
  tasks: [kuka-hammer-v3, kuka-handle-press-side-v3]
  experts:
    kuka-hammer-v3: runs/experts/kuka-v3/hammer-v3/policy.zip
    kuka-handle-press-side-v3: runs/experts/kuka-v3/handle-press-side-v3/policy.zip
  trajectories_per_task: 100
  replay_mode: real
  replay_allocation: fixed-total
  replay_budget: 100
  historical_replay_training_only: true
evaluation:
  episodes: 20
  seed: 10000
  mode: fixed-tasks
  task_set_seed: 10000
runtime:
  seed: 0
  device: cpu
  output: runs/representation_ablation/two_task
  run_name: real_replay_seed0
