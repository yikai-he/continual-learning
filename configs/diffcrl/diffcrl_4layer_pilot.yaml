# Experimental two-task DiffCRL pilot using a four-hidden-layer GeneralPolicy.
# This is intentionally separate from all formal experiment configurations.

experiment: diffcrl

environment:
  reward_function_version: v2

bc:
  epochs: 2
  batch_size: 256
  learning_rate: 0.001
  hidden_sizes:
  - 256
  - 256
  - 256
  - 256
  normalization_mode: layer-norm
  loss: post-tanh-mse

diffusion:
  epochs: 2
  batch_size: 4
  learning_rate: 0.001
  steps: 10
  width: 64
  action_space: raw
  action_clamp_epsilon: 0.0001
  generated_action_projection: none

continual:
  tasks:
  - reach-v3
  - hammer-v3
  experts:
    reach-v3: runs/experts/metaworld-v3/reach-v3/policy.zip
    hammer-v3: runs/experts/metaworld-v3/hammer-v3/policy.zip
  trajectories_per_task: 4
  replay_mode: diffusion

evaluation:
  episodes: 2
  seed: 10000
  mode: fixed-tasks
  task_set_seed: 10000

runtime:
  seed: 0
  device: cpu
  output: runs/diffcrl_4layer_pilot
