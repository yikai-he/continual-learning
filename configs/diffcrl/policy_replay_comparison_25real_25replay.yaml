experiment: diffcrl
environment:
  reward_function_version: v2
bc:
  epochs: 100
  batch_size: 256
  learning_rate: 0.001
  hidden_sizes: [256, 256]
  normalization_mode: layer-norm
  loss: post-tanh-mse
diffusion:
  epochs: 300
  batch_size: 8
  learning_rate: 0.001
  steps: 100
  width: 64
  action_space: raw
  action_clamp_epsilon: 0.0001
  generated_action_projection: none
continual:
  tasks: [hammer-v3, button-press-v3, faucet-close-v3, handle-press-side-v3, window-close-v3]
  experts:
    hammer-v3: runs/experts/metaworld-v3/hammer-v3/policy.zip
    button-press-v3: runs/experts/metaworld-v3/button-press-v3/policy.zip
    faucet-close-v3: runs/experts/metaworld-v3/faucet-close-v3/policy.zip
    handle-press-side-v3: runs/experts/metaworld-v3/handle-press-side-v3/policy.zip
    window-close-v3: runs/experts/metaworld-v3/window-close-v3/policy.zip
  trajectories_per_task: 25
  replay_mode: diffusion
  replay_allocation: fixed-total
  replay_budget: 25
  replay_priority_strategy: uniform
  historical_replay_training_only: true
evaluation:
  episodes: 50
  seed: 10000
  mode: fixed-tasks
  task_set_seed: 10000
runtime:
  seed: 0
  device: cpu
  output: runs/policy_replay_comparison
  run_name: base
