# Activation-only ablation of the completed seed-0 DDPM 30+30 run.
experiment: diffcrl
environment:
  backend: kuka-v3
  reward_function_version: v2
bc:
  epochs: 100
  batch_size: 256
  learning_rate: 0.001
  loss: squashed-gaussian-nll
  initial_log_std: -1.0
  activation: leaky_relu
diffusion:
  epochs: 300
  batch_size: 8
  learning_rate: 0.001
  steps: 100
  width: 64
  action_space: raw
  action_clamp_epsilon: 0.0001
  generated_action_projection: none
continual:
  sequence: kuka_cw10_inspired_5
  experts:
    kuka-hammer-v3: runs/experts/kuka-v3/hammer-v3/policy.zip
    kuka-faucet-close-v3: runs/experts/kuka-v3/faucet-close-v3/policy.zip
    kuka-handle-press-side-v3: runs/experts/kuka-v3/handle-press-side-v3/policy.zip
    kuka-window-close-v3: runs/experts/kuka-v3/window-close-v3/policy.zip
    kuka-peg-unplug-side-v3: runs/experts/kuka-v3/peg-unplug-side-v3/policy.zip
  trajectories_per_task: 30
  replay_mode: diffusion
  replay_allocation: fixed-total
  replay_budget: 30
evaluation:
  episodes: 50
  seed: 10000
  mode: fixed-tasks
  task_set_seed: 10000
runtime:
  seed: 0
  device: cpu
  output: runs/kuka_cw10_inspired_5_ddpm_vs_fm_30plus30/ddpm_leaky_relu
  run_name: seed_0
