# Hammer-first fixed-budget Flow Matching diagnostic; seed 0, CPU only.
experiment: diffcrl

environment:
  reward_function_version: v2

bc:
  epochs: 100
  batch_size: 256
  learning_rate: 0.001
  hidden_sizes: [256, 256]
  normalization_mode: layer-norm
  loss: post-tanh-mse

# Shared physical/action representation contract.
diffusion:
  epochs: 300
  batch_size: 8
  learning_rate: 0.001
  steps: 100
  width: 64
  action_space: raw
  action_clamp_epsilon: 0.0001
  generated_action_projection: none

flow_matching:
  epochs: 200
  batch_size: 8
  learning_rate: 0.001
  width: 64
  residual_blocks: 6
  time_embedding: sinusoidal
  time_embedding_scale: 100.0
  integration_steps: 10
  gradient_clip_norm: 1.0
  validation_samples: 4
  checkpoint_selection: validation-loss
  probability_path: linear
  source_distribution: standard-normal
  ode_solver: euler

continual:
  tasks:
  - hammer-v3
  - button-press-v3
  - faucet-close-v3
  - handle-press-side-v3
  - window-close-v3
  experts:
    hammer-v3: runs/experts/metaworld-v3/hammer-v3/policy.zip
    button-press-v3: runs/experts/metaworld-v3/button-press-v3/policy.zip
    faucet-close-v3: runs/experts/metaworld-v3/faucet-close-v3/policy.zip
    handle-press-side-v3: runs/experts/metaworld-v3/handle-press-side-v3/policy.zip
    window-close-v3: runs/experts/metaworld-v3/window-close-v3/policy.zip
  trajectories_per_task: 200
  replay_mode: flow-matching
  replay_budget: 200
  replay_priority_strategy: uniform

evaluation:
  episodes: 50
  seed: 10000
  mode: fixed-tasks
  task_set_seed: 10000

runtime:
  seed: 0
  device: cpu
  output: runs/pilots/flow_matching_5task_hammer_first
  run_name: flow_matching_5task_hammer_first_seed0
