# Controlled KUKA five-task benchmark: fm_cnn, seed 2.
experiment: diffcrl
environment: {backend: kuka-v3, reward_function_version: v2}
bc:
  epochs: 100
  batch_size: 256
  learning_rate: 0.001
  loss: deterministic_mse
  task_conditioning: none
  initial_log_std: -3.0
  activation: relu
  hidden_dim: 256
diffusion:
  epochs: 300
  batch_size: 8
  learning_rate: 0.001
  steps: 100
  backbone: temporal_cnn
  width: 64
  action_space: raw
  action_clamp_epsilon: 0.0001
  generated_action_projection: none
flow_matching:
  epochs: 300
  batch_size: 8
  learning_rate: 0.001
  backbone: temporal_cnn
  width: 64
  time_embedding_scale: 100.0
  integration_steps: 10
  ode_solver: euler
  rtol: 0.00001
  atol: 0.00001
continual:
  tasks: [kuka-drawer-close-v3, kuka-window-close-v3, kuka-door-open-v3, kuka-peg-unplug-side-v3, kuka-hammer-v3]
  experts:
    kuka-drawer-close-v3: runs/sac_kuka_remaining_4task_1m/drawer-close-v3/seed_0/best_model.zip
    kuka-window-close-v3: runs/sac_kuka_remaining_4task_1m/window-close-v3/seed_0/best_model.zip
    kuka-door-open-v3: runs/sac_kuka_remaining_4task_1m/door-open-v3/seed_0/best_model.zip
    kuka-peg-unplug-side-v3: runs/sac_kuka_remaining_4task_1m/peg-unplug-side-v3/seed_0/best_model.zip
    kuka-hammer-v3: runs/sac_kuka_5task_1m/hammer-v3/seed_0/best_model.zip
  trajectories_per_task: 100
  replay_mode: flow-matching
  replay_allocation: fixed-total
  replay_budget: 100
  historical_replay_training_only: false
  collection_mode: all
  expert_action_mode: deterministic
evaluation: {episodes: 50, seed: 10000, mode: fixed-tasks, task_set_seed: 10000}
runtime:
  seed: 2
  device: cpu
  output: runs/five_task_benchmark
  run_name: kuka5_fm_cnn_seed2
