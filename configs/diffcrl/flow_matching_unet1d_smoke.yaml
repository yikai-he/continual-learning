# Two-task Temporal U-Net FM pipeline smoke; not a performance experiment.
# Relative to the formal U-Net run: 2 tasks, 4 trajectories/task, 2 epochs,
# batch size 4, width 8, and 2 evaluation episodes. Euler sampling stays at 10 steps.
experiment: diffcrl
environment:
  reward_function_version: v2
bc:
  epochs: 2
  batch_size: 256
  learning_rate: 0.001
  loss: squashed-gaussian-nll
diffusion:
  epochs: 2
  batch_size: 4
  learning_rate: 0.001
  steps: 10
  width: 64
  action_space: pre-tanh
  action_clamp_epsilon: 0.0001
  generated_action_projection: none
flow_matching:
  epochs: 2
  batch_size: 4
  learning_rate: 0.001
  backbone: temporal_unet1d
  width: 8
  time_embedding_scale: 100.0
  integration_steps: 10
  ode_solver: euler
continual:
  tasks: [reach-v3, hammer-v3]
  experts:
    reach-v3: runs/experts/metaworld-v3/reach-v3/policy.zip
    hammer-v3: runs/experts/metaworld-v3/hammer-v3/policy.zip
  trajectories_per_task: 4
  replay_mode: flow-matching
  replay_budget: 4
evaluation:
  episodes: 2
  seed: 10000
  mode: fixed-tasks
  task_set_seed: 10000
runtime:
  seed: 0
  device: cpu
  output: runs/flow_matching_unet1d_smoke
