# Controlled MetaWorld-v3 four-stage FM arm with stabilized stochastic BC initialization.
experiment: diffcrl
environment:
  backend: metaworld-v3
  reward_function_version: v2
bc:
  epochs: 100
  batch_size: 256
  learning_rate: 0.001
  loss: squashed-gaussian-nll
  initial_log_std: -1.0
diffusion:
  epochs: 300
  batch_size: 8
  learning_rate: 0.001
  steps: 100
  width: 64
  action_space: raw
  action_clamp_epsilon: 0.0001
  generated_action_projection: none
flow_matching:
  epochs: 300
  batch_size: 8
  learning_rate: 0.001
  width: 64
  time_embedding_scale: 100.0
  integration_steps: 10
  ode_solver: euler
continual:
  tasks: [button-press-v3, faucet-close-v3, hammer-v3, handle-press-side-v3]
  experts:
    button-press-v3: runs/experts/metaworld-v3/button-press-v3/policy.zip
    faucet-close-v3: runs/experts/metaworld-v3/faucet-close-v3/policy.zip
    hammer-v3: runs/experts/metaworld-v3/hammer-v3/policy.zip
    handle-press-side-v3: runs/experts/metaworld-v3/handle-press-side-v3/policy.zip
  trajectories_per_task: 100
  replay_mode: flow-matching
  replay_allocation: fixed-total
  replay_budget: 100
evaluation:
  episodes: 50
  seed: 10000
  mode: fixed-tasks
  task_set_seed: 10000
runtime:
  seed: 0
  device: cpu
  output: runs/metaworld_4stage_ddpm_vs_fm_100plus100_logstd_minus1/flow_matching_fm10
  run_name: seed_0
