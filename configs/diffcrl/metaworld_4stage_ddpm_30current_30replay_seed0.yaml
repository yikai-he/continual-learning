# Controlled MetaWorld-v3 four-stage DDPM arm: 30 current + 30 total replay.
experiment: diffcrl
environment:
  backend: metaworld-v3
  reward_function_version: v2
bc:
  epochs: 100
  batch_size: 256
  learning_rate: 0.001
  loss: squashed-gaussian-nll
diffusion:
  epochs: 300
  batch_size: 8
  learning_rate: 0.001
  steps: 100
  width: 64
  action_space: raw
  action_clamp_epsilon: 0.0001
  generated_action_projection: none
continual:
  tasks: [button-press-v3, faucet-close-v3, hammer-v3, handle-press-side-v3]
  experts:
    button-press-v3: runs/experts/metaworld-v3/button-press-v3/policy.zip
    faucet-close-v3: runs/experts/metaworld-v3/faucet-close-v3/policy.zip
    hammer-v3: runs/experts/metaworld-v3/hammer-v3/policy.zip
    handle-press-side-v3: runs/experts/metaworld-v3/handle-press-side-v3/policy.zip
  trajectories_per_task: 30
  replay_mode: diffusion
  replay_allocation: fixed-total
  replay_budget: 30
evaluation:
  episodes: 50
  seed: 10000
  mode: fixed-tasks
  task_set_seed: 10000
runtime:
  seed: 0
  device: cpu
  output: runs/metaworld_4stage_ddpm_vs_fm_30plus30/ddpm
  run_name: seed_0
