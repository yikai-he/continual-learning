# Two-task Flow Matching end-to-end integration smoke test.
# This validates pipeline execution only; it is not a performance experiment.
experiment: diffcrl

environment:
  reward_function_version: v2

bc:
  epochs: 2
  batch_size: 256
  learning_rate: 0.001
  loss: post-tanh-mse

diffusion:
  # Shared structured-action representation and replay projection contract.
  epochs: 2
  batch_size: 4
  learning_rate: 0.001
  steps: 10
  width: 64
  action_space: pre-tanh
  action_clamp_epsilon: 0.0001
  generated_action_projection: none

flow_matching:
  epochs: 2
  batch_size: 4
  learning_rate: 0.001
  width: 64
  time_embedding_scale: 100.0
  integration_steps: 10
  ode_solver: euler

continual:
  tasks:
  - reach-v3
  - hammer-v3
  experts:
    reach-v3: runs/experts/metaworld-v3/reach-v3/policy.zip
    hammer-v3: runs/experts/metaworld-v3/hammer-v3/policy.zip
  trajectories_per_task: 4
  replay_mode: flow-matching
  replay_budget: 4

evaluation:
  episodes: 2
  seed: 10000
  mode: fixed-tasks
  task_set_seed: 10000

runtime:
  seed: 0
  device: cpu
  output: runs/flow_matching_smoke
