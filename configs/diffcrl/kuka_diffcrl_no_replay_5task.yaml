# Formal five-task KUKA-v3 BC ablation with no generated past-task data.
experiment: diffcrl
environment:
  backend: kuka-v3
  reward_function_version: v2
bc:
  epochs: 100
  batch_size: 256
  learning_rate: 0.001
  loss: post-tanh-mse
continual:
  tasks:
  - kuka-reach-v3
  - kuka-handle-press-side-v3
  - kuka-drawer-close-v3
  - kuka-faucet-close-v3
  - kuka-hammer-v3
  experts:
    kuka-reach-v3: runs/experts/kuka-v3/reach-v3/policy.zip
    kuka-handle-press-side-v3: runs/experts/kuka-v3/handle-press-side-v3/policy.zip
    kuka-drawer-close-v3: runs/experts/kuka-v3/drawer-close-v3/policy.zip
    kuka-faucet-close-v3: runs/experts/kuka-v3/faucet-close-v3/policy.zip
    kuka-hammer-v3: runs/experts/kuka-v3/hammer-v3/policy.zip
  trajectories_per_task: 200
  replay_mode: none
evaluation:
  episodes: 50
  seed: 10000
  mode: fixed-tasks
  task_set_seed: 10000
runtime:
  seed: 0
  device: cpu
  output: runs/kuka_diffcrl_no_replay_5task
