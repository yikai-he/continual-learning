# Stable settings; CLI overrides only runtime seed, device, and run_name.
# Paths are relative to the working directory.
experiment: continual_sac
environment:
  reward_function_version: v2
sac:
  learning_rate: 0.0003
  buffer_size: 5000
  learning_starts: 50
  batch_size: 256
  gamma: 0.99
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  net_arch:
  - 256
  - 256
continual:
  tasks:
  - reach-v3
  - hammer-v3
  steps_per_task: 500
  boundary_warmup_steps: 50
evaluation:
  episodes: 2
  seed: 10000
  mode: sampled
runtime:
  seed: 0
  device: auto
  output: runs/continual_sac_smoke
