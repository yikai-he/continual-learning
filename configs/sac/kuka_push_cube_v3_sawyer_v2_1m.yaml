experiment: sac
environment: {backend: kuka-v3, reward_function_version: v2}
sac:
  steps: 1000000
  learning_rate: 0.001
  buffer_size: 1000000
  learning_starts: 10000
  batch_size: 128
  gamma: 0.99
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  checkpoint_freq: 50000
  early_stopping: {enabled: false, min_steps: 100000, success_threshold: 0.95, patience: 3}
continual: {tasks: [kuka-push-cube-v3]}
evaluation: {episodes: 50, frequency: 20000, seed_offset: 10000, mode: fixed-tasks, task_set_seed: 10000}
runtime: {seed: 0, device: auto, output: runs/training_baselines/kuka-push-cube-v3/sawyer-v2-1m, run_name: seed_0_fresh_1m}
