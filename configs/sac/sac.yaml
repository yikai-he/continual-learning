# Canonical single-task SAC expert protocol. Change only continual.tasks[0]
# when training another MetaWorld v3 expert.
experiment: sac
environment:
  reward_function_version: v2
sac:
  steps: 1000000
  learning_rate: 0.001
  buffer_size: 1000000
  learning_starts: 1000
  random_exploration_steps: 10000
  target_output_std: 0.089
  batch_size: 128
  gamma: 0.99
  tau: 0.005
  train_freq: 50
  gradient_steps: 50
continual:
  tasks:
  - reach-v3
evaluation:
  episodes: 10
  frequency: 40000
  seed_offset: 10000
  mode: fixed-tasks
  task_set_seed: 10000
  final_task_set_seeds: [20000, 20001]
  final_reset_seed: 30000
runtime:
  seed: 0
  device: auto
  output: runs
