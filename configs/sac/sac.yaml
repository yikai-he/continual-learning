# Canonical single-task SAC expert protocol. Change only continual.tasks[0]
# when training another MetaWorld v3 expert.
experiment: sac
environment:
  reward_function_version: v2
sac:
  steps: 1000000
  learning_rate: 0.001
  buffer_size: 1000000
  learning_starts: 10000
  batch_size: 128
  gamma: 0.99
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  checkpoint_freq: 50000
  # low_disk (default): root-level best_model.zip + latest_model.zip, no replay.
  # full: periodic model/replay pairs plus legacy best-return/best-success outputs.
  checkpoint_mode: low_disk
continual:
  tasks:
  - reach-v3
evaluation:
  episodes: 10
  frequency: 20000
  seed_offset: 10000
  mode: fixed-tasks
  task_set_seed: 10000
  final_task_set_seeds: [20000, 20001]
  final_reset_seed: 30000
runtime:
  seed: 0
  device: auto
  output: runs
