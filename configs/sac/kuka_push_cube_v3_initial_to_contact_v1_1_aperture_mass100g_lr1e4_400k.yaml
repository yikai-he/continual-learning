experiment: sac
environment:
  backend: kuka-v3
  reward_function_version: v1_1_initial_to_contact_aperture
  cube_push_curriculum_level: 2
  cube_push_initialization: default
sac:
  steps: 400000
  learning_rate: 0.0001
  buffer_size: 1000000
  learning_starts: 20000
  batch_size: 256
  gamma: 0.99
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  net_arch: [256, 256, 256, 256]
  checkpoint_freq: 20000
  early_stopping: {enabled: true, min_steps: 100000, success_threshold: 0.95, patience: 3}
continual:
  tasks: [kuka-push-cube-v3]
evaluation:
  episodes: 50
  frequency: 20000
  seed_offset: 10000
  mode: fixed-tasks
  task_set_seed: 10000
runtime:
  seed: 0
  device: auto
  output: runs/exploratory/kuka-push-cube-v3/initial_to_contact/reward_v1_1_initial_to_contact_aperture/mass_100g/lr_1e4
  run_name: seed_0_400k
