# Cheap single-task SAC pipeline validation; not a performance experiment.
experiment: sac
environment:
  reward_function_version: v2
sac:
  steps: 500
  learning_rate: 0.001
  buffer_size: 5000
  learning_starts: 50
  random_exploration_steps: 50
  target_output_std: 0.089
  batch_size: 128
  gamma: 0.99
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
continual:
  tasks:
  - reach-v3
evaluation:
  episodes: 2
  frequency: 250
  seed_offset: 10000
  mode: fixed-tasks
  task_set_seed: 10000
runtime:
  seed: 0
  device: auto
  output: runs/sac_smoke
