# First-stage Hammer reward screening: unchanged V2 reward.
experiment: sac
environment:
  backend: kuka-v3
  reward_function_version: v2
  hammer_reward_variant: original
  hammer_nail_progress_weight: 0.0
sac:
  steps: 250000
  learning_rate: 0.001
  buffer_size: 1000000
  learning_starts: 10000
  batch_size: 128
  gamma: 0.99
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  net_arch: [256, 256, 256, 256]
  checkpoint_freq: 50000
  early_stopping: {enabled: true, min_steps: 100000, success_threshold: 0.95, patience: 3}
continual: {tasks: [kuka-hammer-v3]}
evaluation:
  episodes: 20
  frequency: 20000
  seed_offset: 10000
  mode: fixed-tasks
  task_set_seed: 10000
runtime:
  seed: 0
  device: auto
  output: runs/hammer_reward_ablation_250k
  run_name: original_seed_0
