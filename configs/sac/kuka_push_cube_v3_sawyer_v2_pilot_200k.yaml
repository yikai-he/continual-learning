experiment: sac
environment: {backend: kuka-v3, reward_function_version: v2}
sac:
  steps: 200000
  learning_rate: 0.001
  buffer_size: 1000000
  learning_starts: 1000
  random_exploration_steps: 10000
  target_output_std: 0.089
  batch_size: 128
  gamma: 0.99
  tau: 0.005
  train_freq: 50
  gradient_steps: 50
  early_stopping: {enabled: false, min_steps: 100000, success_threshold: 0.95, patience: 3}
continual: {tasks: [kuka-push-cube-v3]}
evaluation: {episodes: 50, frequency: 40000, seed_offset: 10000, mode: fixed-tasks, task_set_seed: 10000}
runtime: {seed: 0, device: auto, output: runs/training_pilots/kuka-push-cube-v3/sawyer-v2-200k, run_name: seed_0_fresh_200k_pilot}
