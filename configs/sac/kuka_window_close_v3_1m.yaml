# Formal 1M-step single-task SAC expert run.
# Provenance baseline: MetaWorld 3.1.1, Gymnasium 1.3.0, MuJoCo 3.3.0.
# MetaWorld checkout: branch kuka-v3, commit c4af9a6f5f45cfd74c118b8c32b3be4253dada2f.
# Environment registration: Meta-World-KUKA/MT1; horizon: 200.
experiment: sac
environment:
  backend: kuka-v3
  reward_function_version: v2
sac:
  steps: 1000000
  learning_rate: 0.001
  buffer_size: 1000000
  learning_starts: 10000
  batch_size: 128
  gamma: 0.99
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  net_arch: [256, 256, 256, 256]
  checkpoint_freq: 50000
continual:
  tasks: [kuka-window-close-v3]
evaluation:
  episodes: 20
  frequency: 20000
  seed_offset: 10000
runtime:
  seed: 0
  device: auto
  output: runs/reward_v2/kuka-window-close-v3
  run_name: seed_0_1m
