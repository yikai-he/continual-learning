# Continue the 200k progress-reward ablation to a 600k cumulative maximum.
# Invoke with --resume-from and the matched 200k periodic checkpoint/replay pair.
experiment: sac
environment:
  backend: kuka-v3
  reward_function_version: v2
  peg_unplug_reward_variant: peg_unplug_progress_v1
  peg_unplug_progress_weight: 2.0
  peg_unplug_progress_gamma: 0.99
sac:
  steps: 600000
  learning_rate: 0.001
  buffer_size: 1000000
  learning_starts: 10000
  batch_size: 128
  gamma: 0.99
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  net_arch: [256, 256, 256, 256]
  checkpoint_freq: 50000
  early_stopping: {enabled: true, min_steps: 100000, success_threshold: 0.95, patience: 3}
continual:
  tasks: [kuka-peg-unplug-side-v3]
evaluation:
  episodes: 50
  frequency: 20000
  seed_offset: 10000
  mode: fixed-tasks
  task_set_seed: 10000
runtime:
  seed: 0
  device: auto
  output: runs/reward_ablations/kuka-peg-unplug-side-v3/progress_v1_resume_600k
  run_name: seed_0_from_200k
