# Short learning experiment; kept separate from the planned full run.
# Provenance baseline: MetaWorld 3.1.1, Gymnasium 1.3.0, MuJoCo 3.3.0.
# MetaWorld checkout: branch kuka-v3, commit 7ea2b501c4a698c8533cdc55a396fe2734e2649d.
# Environment registration: Meta-World-KUKA/MT1; horizon: 200.
experiment: sac
environment:
  backend: kuka-v3
  reward_function_version: v2
sac:
  steps: 50000
  learning_rate: 0.001
  buffer_size: 1000000
  learning_starts: 10000
  batch_size: 128
  gamma: 0.99
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  net_arch:
  - 256
  - 256
  - 256
  - 256
  checkpoint_freq: 10000
continual:
  tasks:
  - kuka-push-v3
evaluation:
  episodes: 20
  frequency: 5000
  seed_offset: 10000
runtime:
  seed: 0
  device: auto
  output: runs/reward_v2/kuka-push-v3
  run_name: seed_0_short_50k
