experiment: sac
environment: {backend: metaworld-v3, reward_function_version: v2}
sac:
  steps: 500000
  early_stopping: {enabled: true, min_steps: 120000, success_threshold: 1.0, patience: 3, plateau_patience: 6, min_delta: 0.02}
actor_init: {mode: scratch, checkpoint: null}
resume:
  enabled: true
  checkpoint: experts/sawyer/stick-pull-v3/sac_continuation_20261117/seed_0/best_model.zip
  replay_buffer: null
  refill_steps: 10000
continual: {tasks: [stick-pull-v3]}
evaluation:
  episodes: 100
  final_episodes: 100
  frequency: 40000
  seed_offset: 10000
  mode: fixed-tasks
  task_set_seed: 10000
  final_task_set_seeds: [20000, 20001]
  final_reset_seed: 30000
runtime: {seed: 0, device: auto, output: runs/sac_early_stop_20261117/stick-pull-v3, run_name: seed_0}
