# Integration-only run: deliberately short learning start to exercise updates.
experiment: sac
environment:
  backend: kuka-v3
  reward_function_version: v2
sac:
  steps: 2000
  learning_rate: 0.001
  buffer_size: 1000000
  learning_starts: 1000
  batch_size: 128
  gamma: 0.99
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  net_arch:
  - 256
  - 256
  - 256
  - 256
  checkpoint_freq: 1000
continual:
  tasks:
  - kuka-reach-v3
evaluation:
  episodes: 2
  frequency: 1000
  seed_offset: 10000
runtime:
  seed: 0
  device: auto
  output: runs/sac_smoke/kuka-reach-v3
  run_name: seed_0_smoke_2k
