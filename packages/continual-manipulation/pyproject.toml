[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "continual-manipulation"
version = "0.1.0"
description = "The reusable Continual Manipulation robotic benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "ContinualManipulation contributors"}]
dependencies = [
  "gymnasium==1.3.0",
  "metaworld==3.1.1",
  "numpy>=1.26,<3",
  "packaging>=23.2,<27",
  "tqdm>=4.66,<5",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["continual_manipulation*"]
