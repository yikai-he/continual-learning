generation:
  trajectories: 200
  seed: 100000
  action_projection: none
bc:
  epochs: 100
  batch_size: 256
  learning_rate: 0.001
  hidden_sizes:
  - 256
  - 256
  loss: post-tanh-mse
  initialization_seed: 17
  shuffle_seed: 0
evaluation:
  episodes: 50
  seed: 10000
  mode: fixed-tasks
  task_set_seed: 10000
debug:
  flow_epochs: 2
  diffusion_epochs: 2
  diffusion_steps: 5
  trajectories: 8
  bc_epochs: 2
  evaluation_episodes: 2
output_dir: runs/flow_matching_harder_task/hammer_v3_seed0
