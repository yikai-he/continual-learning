kind: flow_matching_harder_single_task_v1
task: hammer-v3
backend: metaworld-v3
reward_function_version: v2
seed: 0
device: cpu
output_root: runs/flow_matching_harder_task/hammer_v3_seed0
assets:
  expert_dataset: runs/formal/diffcrl_5task_200traj/diffcrl_5task_200traj_seed0/stage_2_hammer-v3/data_task_2.npy
